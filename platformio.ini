; PlatformIO Project Configuration File for Master Helper (ESP32-C3)
; ESP-IDF Framework with OTA and Web Configuration Interface

[platformio]
default_envs = esp32-c3-devkitm-1

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = espidf
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
extra_scripts = post:scripts/copy_compiled.py
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DCORE_DEBUG_LEVEL=3
